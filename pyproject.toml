[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "centerfield-visitor-mcp"
version = "0.2.0"
description = "MCP server for Centerfield building visitor reservation (stdio + streamable HTTP)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Hyunmin Kim" }
]
keywords = ["mcp", "model-context-protocol", "centerfield", "visitor", "reservation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    # mcp 1.x (FastMCP) and 2.x (MCPServer) are both supported via centerfield_visitor_mcp/_compat.py
    "mcp>=1.10",
    "httpx>=0.27.0",
    "pydantic[email]>=2.8.0",
    "pydantic-settings>=2.4.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "openpyxl>=3.1.5",
]

[project.urls]
Homepage = "https://github.com/hmkim/centerfield-visitor-mcp"
Repository = "https://github.com/hmkim/centerfield-visitor-mcp"

[project.scripts]
centerfield-visitor-mcp = "centerfield_visitor_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: talks to www.centerfield.co.kr (read-only unless explicitly allowed)",
]
addopts = "-m 'not live'"

[tool.hatch.build.targets.wheel]
packages = ["centerfield_visitor_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "centerfield_visitor_mcp/**",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]
