name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        mcp: ["locked", "mcp<2"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Lockfile is current
        run: uv lock --check
      - name: Install
        run: uv sync --group dev
      - name: Unit tests (offline)
        run: |
          if [ "${{ matrix.mcp }}" = "locked" ]; then
            uv run pytest -q
          else
            uv run --with "${{ matrix.mcp }}" pytest -q
          fi
      - name: Streamable HTTP smoke test
        run: |
          if [ "${{ matrix.mcp }}" = "locked" ]; then
            uv run python scripts/smoke_http.py
          else
            uv run --with "${{ matrix.mcp }}" python scripts/smoke_http.py
          fi

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: uv build
      - name: Fresh-install import check (wheel, latest mcp)
        run: |
          uv run --no-project --with dist/*.whl python -c "import centerfield_visitor_mcp.server as s, asyncio; print(sorted(t.name for t in asyncio.run(s.mcp.list_tools())))"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
